org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Release API endpoint (must be https). Override with -Pfamilysafety.apiBaseUrl=... or in ~/.gradle/gradle.properties
familysafety.apiBaseUrl=https://api.familysafety.example/
# Debug API endpoint (Android emulator -> host machine). Cleartext is allowed only for debug builds and these hosts.
familysafety.debugApiBaseUrl=http://10.0.2.2:8080/
