spring:
  application:
    name: family-safety-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/familysafety}
    username: ${DATABASE_USERNAME:familysafety}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  # Honour X-Forwarded-* only from the trusted reverse proxy that terminates TLS.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  error:
    include-message: never
    include-stacktrace: never
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEY_STORE:}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE:PKCS12}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

familysafety:
  security:
    jwt-secret: ${JWT_SECRET:}
    pairing-pepper: ${PAIRING_PEPPER:}
    require-https: ${REQUIRE_HTTPS:true}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
  screen-sharing:
    stun-urls: ${STUN_URLS:stun:stun.l.google.com:19302}
    turn-urls: ${TURN_URLS:}
    turn-secret: ${TURN_SECRET:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
