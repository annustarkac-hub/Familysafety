# Render Blueprint: one click creates the Family Safety API + a PostgreSQL database with HTTPS.
# Render dashboard → New → Blueprint → pick this repository (and branch). See docs/FREE_SERVER_RENDER.md.
services:
  - type: web
    name: family-safety-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_HOST
        fromDatabase: { name: family-safety-db, property: host }
      - key: DATABASE_PORT
        fromDatabase: { name: family-safety-db, property: port }
      - key: DATABASE_NAME
        fromDatabase: { name: family-safety-db, property: database }
      - key: DATABASE_USERNAME
        fromDatabase: { name: family-safety-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: family-safety-db, property: password }
      - key: DATABASE_POOL_SIZE
        value: "5"
      # Random base64 256-bit secrets generated by Render (never stored in the repo).
      - key: JWT_SECRET
        generateValue: true
      - key: PAIRING_PEPPER
        generateValue: true
      - key: REQUIRE_HTTPS
        value: "true"
      # Render terminates TLS; the app is only reachable through Render's proxy, so trust its X-Forwarded-* headers.
      - key: FORWARD_HEADERS_STRATEGY
        value: framework

databases:
  - name: family-safety-db
    plan: free
    databaseName: familysafety
    user: familysafety
